# Development Environment Configuration
spring:
  config:
    activate:
      on-profile: dev
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/docusync_db
    username: postgres
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
  
  # JPA Configuration
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
    hibernate:
      ddl-auto: update
  
  # Flyway Configuration
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true
    validate-on-migrate: true
  
  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      password: dev_redis_password
      timeout: 5000
  
  # AI Configuration - Use local Ollama for development
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3
          temperature: 0.7
          max-tokens: 1000
      embedding:
        options:
          model: nomic-embed-text
    openai:
      api-key: ${OPENAI_API_KEY:}
  
  # Jackson Configuration
  jackson:
    serialization:
      indent-output: true
      write-dates-as-timestamps: false
  
# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: always
    include-binding-errors: always
  
# Logging Configuration
logging:
  level:
    root: INFO
    com.docusync: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.redisson: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  
# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  
# Application Specific
docusync:
  security:
    jwt:
      secret: dev-secret-key-change-in-production-0123456789
      expiration: 86400000
      refresh-expiration: 604800000
  websocket:
    allowed-origins: 
      - http://localhost:3000
      - http://localhost:8080
    heartbeat-interval: 30000
  ai:
    vector-store:
      collection-name: document_chunks_dev
      dimensions: 1536
    chunking:
      size: 500
      overlap: 50
  cors:
    allowed-origins:
      - http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
