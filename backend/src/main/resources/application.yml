# Main Application Configuration
# Environment-specific configs: application-dev.yml, application-test.yml, application-prod.yml

spring:
  application:
    name: docusync-backend
    version: 1.0.0
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # Common JPA Settings
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        query:
          fail_on_pagination_over_collection_fetch: true
  
  # Common Jackson Settings
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
  
  # Servlet Settings
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  # Cache Settings
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
  
  # Spring AI Common Settings
  ai:
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1000
        multiplier: 2
        max-interval: 10000

# Server Common Settings
server:
  servlet:
    context-path: /api/v1
  forward-headers-strategy: framework
  shutdown: graceful
  
# Spring Boot Actuator Common
management:
  endpoints:
    web:
      base-path: /actuator
  info:
    env:
      enabled: true
  metrics:
    enable:
      all: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms,50ms,100ms,200ms,500ms,1s,2s

# Application Common Settings
docusync:
  app:
    name: DocuSync Enterprise Engine
    version: 1.0.0
    description: Distributed Real-Time Collaborative Workspace
  websocket:
    max-message-size: 1048576  # 1MB
    send-timeout: 10000
    buffer-size: 65536
  
# Info endpoint
info:
  app:
    name: ${spring.application.name}
    version: ${spring.application.version}
    description: ${docusync.app.description}
