# Test Environment Configuration
spring:
  config:
    activate:
      on-profile: test
  
  # Database Configuration - Use H2 for unit tests
  datasource:
    url: jdbc:h2:mem:docusync_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
    open-in-view: false
  
  # Flyway Configuration
  flyway:
    enabled: false
  
  # Redis Configuration - Use embedded Redis for tests
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      timeout: 2000ms
  
  # AI Configuration - Mock for tests
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3
      embedding:
        options:
          model: nomic-embed-text
    openai:
      api-key: test-key
  
  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  
# Server Configuration
server:
  port: 8081
  error:
    include-message: always
    include-stacktrace: never
  
# Logging Configuration
logging:
  level:
    root: INFO
    com.docusync: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
  
# Application Specific
docusync:
  security:
    jwt:
      secret: test-secret-key-for-testing-purposes-only
      expiration: 3600000
      refresh-expiration: 7200000
  websocket:
    allowed-origins: "*"
    heartbeat-interval: 5000
  ai:
    vector-store:
      collection-name: document_chunks_test
      dimensions: 1536
    chunking:
      size: 100
      overlap: 10